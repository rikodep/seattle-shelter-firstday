<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D5350">
<title>First Day — Seattle Animal Shelter adoption record</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="First Day">
<meta name="description" content="Everything the Seattle Animal Shelter reviews with new adopters, in one place.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   FIRST DAY — design tokens
   Palette drawn from the Seattle Animal Shelter mark (green tree,
   blue dog + cat) and PNW materials: fir, Puget Sound, wet paper.
   ============================================================ */
:root{
  /* Seattle Animal Shelter: deep teal from the shelter's banners, the blue
     of the cat in their logo, the green of the tree, and their signal yellow. */
  --fir:#0D5350;
  --fir-2:#116B66;
  --fir-3:#1C8079;
  --leaf:#5FA544;
  --sound:#1B75BB;
  --sound-2:#E4EFF8;
  --paper:#F1F4EF;
  --card:#FFFFFF;
  --ink:#14201D;
  --ink-2:#3A4A45;
  --muted:#66766F;
  --line:#DCE3DA;
  --line-2:#EAEFE7;
  --marigold:#F0B429;
  --marigold-2:#FEF3D8;
  --rust:#B4522A;
  --rust-2:#FBEAE1;
  --ginger:#E49B41;
  --ok:#3C8B4E;

  --r-s:8px; --r-m:14px; --r-l:22px; --r-xl:30px;
  --shadow-lift:0 1px 2px rgba(15,61,51,.06), 0 8px 24px -12px rgba(15,61,51,.28);
  --shadow-sheet:0 -8px 40px -16px rgba(15,61,51,.4);

  --ui:'Bricolage Grotesque', 'Poppins', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  --read:'Newsreader', 'Source Serif 4', Georgia, 'Iowan Old Style', 'Times New Roman', serif;

  --app-w:460px;
  --nav-h:0px;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--ui);
  background:#D8E0D7;
  color:var(--ink);
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--sound);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--sound);outline-offset:2px;border-radius:4px}
img{max-width:100%;display:block}
/* Icons are 24x24 viewBox with no intrinsic size; give them one. */
svg:not([width]){width:20px;height:20px;flex:none}

/* ---------- desk / phone frame ---------- */
#desk{
  min-height:100dvh;display:flex;align-items:stretch;justify-content:center;
  background:
    radial-gradient(1100px 620px at 50% -10%, #F4F7F2 0%, #D8E0D7 60%, #C6D2C5 100%);
}
#app{
  width:100%;max-width:var(--app-w);background:var(--paper);
  position:relative;display:flex;flex-direction:column;
  min-height:100dvh;overflow:hidden;
}
@media (min-width:900px){
  #desk{padding:26px 0}
  #app{
    min-height:min(920px,calc(100dvh - 52px));max-height:calc(100dvh - 52px);
    border-radius:36px;box-shadow:0 40px 90px -40px rgba(15,61,51,.55), 0 0 0 1px rgba(15,61,51,.08);
  }
}

/* ---------- scroll region ---------- */
.screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.screen::-webkit-scrollbar{width:6px}
.screen::-webkit-scrollbar-thumb{background:#C6D0C4;border-radius:3px}
.pad{padding:0 18px}
.pad-b{padding-bottom:26px}


/* ---------- type ---------- */
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.018em;line-height:1.16}
h1{font-size:29px;font-weight:700;letter-spacing:-.028em}
h2{font-size:21px}
h3{font-size:16.5px}
p{margin:0 0 12px}
.lede{font-size:16px;color:var(--ink-2);line-height:1.5}
.small{font-size:13.5px;color:var(--muted);line-height:1.45}
.tiny{font-size:12px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 12px}
.sec-head h2{font-size:18px}
.sec-head .small{flex:none}

/* ---------- header ---------- */
.topbar{
  position:sticky;top:0;z-index:30;flex:none;background:var(--paper);
  padding:calc(env(safe-area-inset-top) + 12px) 18px 12px;
  border-bottom:1px solid transparent;transition:border-color .2s, background .2s;
}
.topbar.stuck{border-bottom-color:var(--line);background:rgba(239,242,236,.94);backdrop-filter:blur(10px)}
.topbar-row{display:flex;align-items:center;gap:12px;min-height:34px}
.topbar h1{font-size:24px;flex:1;min-width:0}
.back{
  width:34px;height:34px;flex:none;border-radius:50%;background:var(--card);
  border:1px solid var(--line);display:grid;place-items:center;color:var(--fir);
}
.back svg{width:19px;height:19px}
.back:active{transform:scale(.94)}

/* ---------- cards ---------- */
.card{background:var(--card);border-radius:var(--r-l);border:1px solid var(--line-2);padding:16px}
.card-flat{background:var(--card);border-radius:var(--r-m);border:1px solid var(--line-2);padding:14px}
.row{display:flex;gap:12px;align-items:center}
.row-between{display:flex;gap:12px;align-items:center;justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- buttons ---------- */
.btn{
  text-decoration:none;
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:14px 20px;border-radius:999px;font-weight:600;font-size:15.5px;
  background:var(--fir);color:#fff;width:100%;transition:transform .12s ease, filter .12s ease;
  letter-spacing:-.01em;
}
.btn:active{transform:scale(.975);filter:brightness(1.08)}
.btn svg{width:19px;height:19px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn-2{background:var(--card);color:var(--fir);border:1.5px solid var(--line)}
.btn-3{background:transparent;color:var(--fir);padding:12px 14px}
.btn-gold{background:var(--marigold);color:#3A2708}
.btn-s{padding:9px 15px;font-size:13.5px;width:auto}
.btn-row{display:flex;gap:9px}
.btn-row .btn{width:auto;flex:1}

/* ---------- form ---------- */
label.f{display:block;margin-bottom:14px}
label.f > span{display:block;font-size:13.5px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.inp{
  width:100%;padding:13px 14px;border-radius:var(--r-m);border:1.5px solid var(--line);
  background:var(--card);font-size:16px;transition:border-color .15s, box-shadow .15s;
}
.inp:focus{outline:0;border-color:var(--sound);box-shadow:0 0 0 3px var(--sound-2)}
textarea.inp{min-height:88px;resize:vertical;line-height:1.5}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}

/* choice tiles */
.choice{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  padding:15px;border-radius:var(--r-m);border:1.5px solid var(--line);background:var(--card);
  transition:border-color .14s, background .14s;
}
.choice[aria-pressed="true"]{border-color:var(--fir);background:#F4F8F3;box-shadow:inset 0 0 0 1px var(--fir)}
.choice .tick{
  width:21px;height:21px;flex:none;border-radius:50%;border:2px solid var(--line);margin-top:1px;
  display:grid;place-items:center;color:#fff;
}
.choice[aria-pressed="true"] .tick{background:var(--fir);border-color:var(--fir)}
.choice .tick svg{width:13px;height:13px}
.choice b{display:block;font-size:15px;font-weight:600}
.choice em{font-style:normal;font-size:13px;color:var(--muted);display:block;margin-top:2px;line-height:1.4}

/* ---------- pills / chips ---------- */
.pill{
  display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
  font-size:12.5px;font-weight:600;background:var(--line-2);color:var(--ink-2);white-space:nowrap;
}
.pill-gold{background:var(--marigold-2);color:#7A5210}
.pill-rust{background:var(--rust-2);color:var(--rust)}
.pill-ok{background:#E4F1EA;color:var(--ok)}
.pill-blue{background:var(--sound-2);color:#1D5470}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 18px 2px;scrollbar-width:none;-ms-overflow-style:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;padding:9px 15px;border-radius:999px;background:var(--card);border:1px solid var(--line);
  font-size:13.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;transition:all .14s;
}
.chip[aria-pressed="true"]{background:var(--fir);border-color:var(--fir);color:#fff}

/* ---------- pinned top nav, present at every stage ---------- */
#root{flex:1;display:flex;flex-direction:column;min-height:0}
.nav{
  flex:none;z-index:50;display:flex;
  padding-top:env(safe-area-inset-top);
  background:rgba(255,255,255,.95);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.nav button{
  flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;color:var(--muted);font-size:9.5px;font-weight:600;letter-spacing:.005em;
  padding:9px 2px 8px;min-width:0;
}
.nav button svg{width:21px;height:21px}
.nav button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nav button[aria-current="page"]{color:var(--fir)}
.nav button[aria-current="page"]::after{
  content:"";position:absolute;left:22%;right:22%;bottom:0;height:2.5px;
  border-radius:3px 3px 0 0;background:var(--fir);
}
.nav .dot{
  position:absolute;top:7px;margin-left:17px;width:7px;height:7px;border-radius:50%;
  background:var(--marigold);border:1.5px solid #fff;
}

/* ---------- pet header card ---------- */
.pet-hero{
  position:relative;border-radius:var(--r-xl);overflow:hidden;background:var(--fir);
  color:#fff;padding:18px;box-shadow:var(--shadow-lift);
}
.pet-hero::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(340px 200px at 88% -20%, rgba(240,180,41,.30), transparent 70%);
}
.pet-hero .row{position:relative;z-index:1}
.avatar{
  width:74px;height:74px;flex:none;border-radius:20px;object-fit:cover;background:var(--fir-3);
  border:2.5px solid rgba(255,255,255,.35);
}
.avatar-ph{display:grid;place-items:center;color:rgba(255,255,255,.72)}
.avatar-ph svg{width:32px;height:32px}
.pet-hero h2{font-size:25px;letter-spacing:-.03em}
.pet-hero .small{color:rgba(255,255,255,.78)}
.daycount{
  position:relative;z-index:1;margin-top:15px;padding-top:13px;border-top:1px solid rgba(255,255,255,.18);
  display:flex;justify-content:space-between;align-items:center;gap:10px;
}
.daycount b{font-size:15px;font-weight:600}

/* ---------- quick actions ---------- */
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa a,.qa button{
  display:flex;flex-direction:column;align-items:center;gap:7px;padding:13px 4px 11px;
  background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-m);
  font-size:11px;font-weight:600;color:var(--ink-2);text-align:center;text-decoration:none;line-height:1.25;
}
.qa svg{width:21px;height:21px;color:var(--fir)}
.qa .urgent svg{color:var(--rust)}

/* ---------- task list ---------- */
.task{
  display:flex;gap:12px;align-items:flex-start;padding:14px;background:var(--card);
  border:1px solid var(--line-2);border-radius:var(--r-m);text-align:left;width:100%;
  transition:opacity .2s;
}
.task.done{opacity:.55}
.task.done .t-title{text-decoration:line-through;text-decoration-color:var(--muted)}
.box{
  width:24px;height:24px;flex:none;border-radius:8px;border:2px solid var(--line);
  display:grid;place-items:center;color:#fff;transition:all .16s;margin-top:1px;
}
.task.done .box{background:var(--ok);border-color:var(--ok)}
.box svg{width:15px;height:15px}
.t-title{font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.t-meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:6px}
.t-meta .pill svg{width:12px;height:12px;stroke-width:3}
.t-body{flex:1;min-width:0}
.t-why{font-size:13.5px;color:var(--muted);margin-top:6px;line-height:1.45}
.t-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.t-act a,.t-act button{
  font-size:12.5px;font-weight:600;padding:8px 13px;border-radius:999px;
  background:var(--line-2);color:var(--fir);text-decoration:none;display:inline-flex;gap:6px;align-items:center;
}
.t-act svg{width:14px;height:14px}
.phase{
  display:flex;align-items:center;gap:10px;margin:24px 0 11px;
}
.phase h3{font-size:15px;letter-spacing:-.005em}
.phase .line{flex:1;height:1px;background:var(--line)}

/* ---------- progress ---------- */
.prog{height:9px;border-radius:99px;background:var(--line-2);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--fir-3),var(--leaf),var(--marigold));border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}

/* ---------- doc reader ---------- */
.doc-item{
  display:flex;gap:13px;align-items:center;width:100%;text-align:left;padding:15px 14px;
  background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-m);
}
.doc-ico{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--sound-2);color:var(--sound)}
.doc-ico svg{width:19px;height:19px}
.doc-item b{display:block;font-size:15px;font-weight:600;letter-spacing:-.012em;line-height:1.25}
.doc-item.is-done{background:#F6FAF6;border-color:#CFE3D3}
.doc-item.is-done .doc-ico{background:#E2F0E5;color:var(--ok)}
.doc-item .pill svg{width:12px;height:12px;stroke-width:3}
.doc-item .small{display:block;margin-top:3px;font-size:12.5px}
.reader{font-family:var(--read);font-size:17px;line-height:1.62;color:#1B2724}
.reader h3{font-family:var(--ui);font-size:17px;margin:26px 0 9px;letter-spacing:-.015em}
.reader h3:first-child{margin-top:6px}
.reader p{margin:0 0 15px}
.reader ul{margin:0 0 15px;padding-left:20px}
.reader li{margin-bottom:9px}
.reader strong{font-weight:600}
.callout{
  font-family:var(--ui);font-size:14.5px;line-height:1.5;padding:14px 15px;border-radius:var(--r-m);
  background:var(--marigold-2);border-left:3px solid var(--marigold);margin:0 0 16px;color:#4A3208;
}
.callout.blue{background:var(--sound-2);border-left-color:var(--sound);color:#1B4257}
.callout b{font-weight:700}
.srcline{
  font-family:var(--ui);font-size:12.5px;color:var(--muted);line-height:1.5;
  padding:13px 14px;background:var(--line-2);border-radius:var(--r-m);margin-top:22px;
}

/* zone cards (body language) */
.zone{border-radius:var(--r-m);padding:14px;margin-bottom:11px;font-family:var(--ui)}
.zone-g{background:#E7F1E9;border-left:4px solid #2F7D5E}
.zone-y{background:#FBF1DC;border-left:4px solid var(--marigold)}
.zone-r{background:#FAE7DE;border-left:4px solid var(--rust)}
.zone h4{font-size:14.5px;margin-bottom:5px}
.zone p{font-size:13.5px;line-height:1.5;margin:0 0 9px;color:var(--ink-2)}
.zone dl{margin:0;font-size:13px;line-height:1.5}
.zone dt{font-weight:700;margin-top:8px}
.zone dd{margin:0;color:var(--ink-2)}

/* ---------- directory ---------- */
.dir{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-m);padding:15px}
.dir b{font-size:15px;font-weight:600;letter-spacing:-.012em;display:block;line-height:1.3}
.dir .addr{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.45}
.dir-act{display:flex;gap:8px;margin-top:12px}
.dir-act a{
  flex:1;text-align:center;padding:10px;border-radius:10px;background:var(--fir);color:#fff;
  font-size:13.5px;font-weight:600;text-decoration:none;display:inline-flex;gap:7px;align-items:center;justify-content:center;
}
.dir-act a.alt{background:var(--line-2);color:var(--fir)}
.dir-act svg{width:15px;height:15px}
.dir.urgent{border-color:#F0CDBC;background:#FEF7F3}

/* ---------- perks ---------- */
.perk{border-radius:var(--r-l);padding:16px;border:1px solid var(--line-2);background:var(--card);position:relative;overflow:hidden}
.perk .code{
  font-family:var(--ui);font-weight:700;letter-spacing:.09em;font-size:17px;
  background:var(--paper);border:1.5px dashed var(--line);border-radius:10px;
  padding:11px;text-align:center;margin-top:12px;
}
.perk-strip{height:5px;margin:-16px -16px 14px;background:linear-gradient(90deg,var(--fir-3),var(--leaf),var(--marigold))}

/* ---------- record rows ---------- */
.rec{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--line-2);font-size:14.5px}
.rec:last-child{border-bottom:0}
.rec dt{color:var(--muted);flex:none;font-size:13.5px}
.rec dd{margin:0;font-weight:600;text-align:right;word-break:break-word}

/* ---------- QR ---------- */
.qr-wrap{
  background:var(--card);border-radius:var(--r-xl);padding:20px;border:1px solid var(--line-2);
  box-shadow:var(--shadow-lift);
}
.qr-wrap svg{width:100%;height:auto;display:block}

/* ---------- setup progress ---------- */
.steps{display:flex;gap:5px;padding:0 18px 4px}
.steps i{flex:1;height:4px;border-radius:99px;background:var(--line);transition:background .3s}
.steps i.on{background:var(--fir)}

/* ---------- celebration ---------- */
#celebrate{
  position:absolute;inset:0;z-index:60;background:var(--fir);color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:34px 26px;overflow:hidden;
}
#celebrate .burst{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.conf{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;opacity:0;will-change:transform}
@keyframes fall{
  0%{opacity:0;transform:translate3d(0,-10px,0) rotate(0)}
  8%{opacity:1}
  100%{opacity:0;transform:translate3d(var(--dx),108vh,0) rotate(var(--rot))}
}
.cel-in{position:relative;z-index:2;max-width:330px}
.cel-badge{
  width:120px;height:120px;margin:0 auto 22px;border-radius:34px;background:rgba(255,255,255,.1);
  display:grid;place-items:center;border:1.5px solid rgba(255,255,255,.25);
  animation:pop .7s cubic-bezier(.2,1.3,.4,1) both;
}
@keyframes pop{0%{transform:scale(.5) rotate(-9deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.cel-in h1{font-size:33px;letter-spacing:-.032em;animation:rise .55s .18s cubic-bezier(.2,.9,.3,1) both}
.cel-in .lede{color:rgba(255,255,255,.82);margin-top:12px;animation:rise .55s .3s cubic-bezier(.2,.9,.3,1) both}
.cel-in .acts{margin-top:30px;animation:rise .55s .44s cubic-bezier(.2,.9,.3,1) both;display:flex;flex-direction:column;gap:10px}
@keyframes rise{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:none}}
#celebrate .btn-2{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3)}

/* ---------- sheet ---------- */
.sheet-bg{position:absolute;inset:0;z-index:70;background:rgba(12,32,27,.5);backdrop-filter:blur(2px);animation:fade .2s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:71;background:var(--paper);
  border-radius:26px 26px 0 0;box-shadow:var(--shadow-sheet);max-height:88%;overflow-y:auto;
  padding:8px 18px calc(24px + env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.2,.9,.3,1) both;
}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grabber{width:38px;height:4px;border-radius:99px;background:var(--line);margin:6px auto 16px}

/* ---------- toast ---------- */
#toast{
  position:absolute;left:50%;bottom:calc(var(--nav-h) + 16px);transform:translateX(-50%) translateY(14px);
  z-index:90;background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-size:13.5px;
  font-weight:600;opacity:0;pointer-events:none;transition:opacity .22s, transform .22s;

.empty{text-align:center;padding:44px 22px;color:var(--muted)}

.eco{background:linear-gradient(150deg,#E9F3E4,#F1F6EC);border:1px solid #D2E4CB;border-radius:var(--r-l);padding:16px}

.cert dl{margin:0;position:relative}

.cert .cut{border-top:2px dashed var(--line);margin:14px -16px;padding-top:13px}

        return QRUtil.PATTERN_POSITION_TABLE[typeNumber - 1];
    },

    getMask : function(maskPattern, i, j) {
        
        switch (maskPattern) {
            
        case QRMaskPattern.PATTERN000 : return (i + j) % 2 === 0;
        case QRMaskPattern.PATTERN001 : return i % 2 === 0;
        case QRMaskPattern.PATTERN010 : return j % 3 === 0;
        case QRMaskPattern.PATTERN011 : return (i + j) % 3 === 0;
        case QRMaskPattern.PATTERN100 : return (Math.floor(i / 2) + Math.floor(j / 3) ) % 2 === 0;
        case QRMaskPattern.PATTERN101 : return (i * j) % 2 + (i * j) % 3 === 0;
        case QRMaskPattern.PATTERN110 : return ( (i * j) % 2 + (i * j) % 3) % 2 === 0;
        case QRMaskPattern.PATTERN111 : return ( (i * j) % 3 + (i + j) % 2) % 2 === 0;

        default :
            throw new Error("bad maskPattern:" + maskPattern);
        }
    },

    getErrorCorrectPolynomial : function(errorCorrectLength) {

        var a = new QRPolynomial([1], 0);

        for (var i = 0; i < errorCorrectLength; i++) {
            a = a.multiply(new QRPolynomial([1, QRMath.gexp(i)], 0) );
        }

        return a;
    },

    getLengthInBits : function(mode, type) {

        if (1 <= type && type < 10) {

            // 1 - 9

            switch(mode) {
            case QRMode.MODE_NUMBER     : return 10;
            case QRMode.MODE_ALPHA_NUM  : return 9;
            case QRMode.MODE_8BIT_BYTE  : return 8;
            case QRMode.MODE_KANJI      : return 8;
            default :
                throw new Error("mode:" + mode);
            }

        } else if (type < 27) {

            // 10 - 26

            switch(mode) {
            case QRMode.MODE_NUMBER     : return 12;
            case QRMode.MODE_ALPHA_NUM  : return 11;
            case QRMode.MODE_8BIT_BYTE  : return 16;
            case QRMode.MODE_KANJI      : return 10;
            default :
                throw new Error("mode:" + mode);
            }

        } else if (type < 41) {

            // 27 - 40

            switch(mode) {
            case QRMode.MODE_NUMBER     : return 14;
            case QRMode.MODE_ALPHA_NUM  : return 13;
            case QRMode.MODE_8BIT_BYTE  : return 16;
            case QRMode.MODE_KANJI      : return 12;
            default :
                throw new Error("mode:" + mode);
            }

        } else {
            throw new Error("type:" + type);
        }
    },

    getLostPoint : function(qrCode) {
        
        var moduleCount = qrCode.getModuleCount();
        var lostPoint = 0;
        var row = 0; 
        var col = 0;

        
        // LEVEL1
        
        for (row = 0; row < moduleCount; row++) {

            for (col = 0; col < moduleCount; col++) {

                var sameCount = 0;
                var dark = qrCode.isDark(row, col);

                for (var r = -1; r <= 1; r++) {

                    if (row + r < 0 || moduleCount <= row + r) {
                        continue;
                    }

                    for (var c = -1; c <= 1; c++) {

                        if (col + c < 0 || moduleCount <= col + c) {
                            continue;
                        }

                        if (r === 0 && c === 0) {
                            continue;
                        }

                        if (dark === qrCode.isDark(row + r, col + c) ) {
                            sameCount++;
                        }
                    }
                }

                if (sameCount > 5) {
                    lostPoint += (3 + sameCount - 5);
                }
            }
        }

        // LEVEL2

        for (row = 0; row < moduleCount - 1; row++) {
            for (col = 0; col < moduleCount - 1; col++) {
                var count = 0;
                if (qrCode.isDark(row,     col    ) ) count++;
                if (qrCode.isDark(row + 1, col    ) ) count++;
                if (qrCode.isDark(row,     col + 1) ) count++;
                if (qrCode.isDark(row + 1, col + 1) ) count++;
                if (count === 0 || count === 4) {
                    lostPoint += 3;
                }
            }
        }

        // LEVEL3

        for (row = 0; row < moduleCount; row++) {
            for (col = 0; col < moduleCount - 6; col++) {
                if (qrCode.isDark(row, col) && 
                        !qrCode.isDark(row, col + 1) && 
                         qrCode.isDark(row, col + 2) && 
                         qrCode.isDark(row, col + 3) && 
                         qrCode.isDark(row, col + 4) && 
                        !qrCode.isDark(row, col + 5) && 
                         qrCode.isDark(row, col + 6) ) {
                    lostPoint += 40;
                }
            }
        }

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount - 6; row++) {
                if (qrCode.isDark(row, col) &&
                        !qrCode.isDark(row + 1, col) &&
                         qrCode.isDark(row + 2, col) &&
                         qrCode.isDark(row + 3, col) &&
                         qrCode.isDark(row + 4, col) &&
                        !qrCode.isDark(row + 5, col) &&
                         qrCode.isDark(row + 6, col) ) {
                    lostPoint += 40;
                }
            }
        }

        // LEVEL4
        
        var darkCount = 0;

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount; row++) {
                if (qrCode.isDark(row, col) ) {
                    darkCount++;
                }
            }
        }
        
        var ratio = Math.abs(100 * darkCount / moduleCount / moduleCount - 50) / 5;
        lostPoint += ratio * 10;

        return lostPoint;       
    }

};

function QRCode(typeNumber, errorCorrectLevel) {
	this.typeNumber = typeNumber;
	this.errorCorrectLevel = errorCorrectLevel;
	this.modules = null;
	this.moduleCount = 0;
	this.dataCache = null;
	this.dataList = [];
}

QRCode.prototype = {
	
	addData : function(data) {
		var newData = new QR8bitByte(data);
		this.dataList.push(newData);
		this.dataCache = null;
	},
	
	isDark : function(row, col) {
		if (row < 0 || this.moduleCount <= row || col < 0 || this.moduleCount <= col) {
			throw new Error(row + "," + col);
		}
		return this.modules[row][col];
	},

	getModuleCount : function() {
		return this.moduleCount;
	},
	
	make : function() {
		// Calculate automatically typeNumber if provided is < 1
		if (this.typeNumber < 1 ){
			var typeNumber = 1;
			for (typeNumber = 1; typeNumber < 40; typeNumber++) {
				var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, this.errorCorrectLevel);

				var buffer = new QRBitBuffer();
				var totalDataCount = 0;
				for (var i = 0; i < rsBlocks.length; i++) {
					totalDataCount += rsBlocks[i].dataCount;
				}

				for (var x = 0; x < this.dataList.length; x++) {
					var data = this.dataList[x];
					buffer.put(data.mode, 4);
					buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
					data.write(buffer);
				}
				if (buffer.getLengthInBits() <= totalDataCount * 8)
					break;
			}
			this.typeNumber = typeNumber;
		}
		this.makeImpl(false, this.getBestMaskPattern() );
	},
	
	makeImpl : function(test, maskPattern) {
		
		this.moduleCount = this.typeNumber * 4 + 17;
		this.modules = new Array(this.moduleCount);
		
		for (var row = 0; row < this.moduleCount; row++) {
			
			this.modules[row] = new Array(this.moduleCount);
			
			for (var col = 0; col < this.moduleCount; col++) {
				this.modules[row][col] = null;//(col + row) % 3;
			}
		}
	
		this.setupPositionProbePattern(0, 0);
		this.setupPositionProbePattern(this.moduleCount - 7, 0);
		this.setupPositionProbePattern(0, this.moduleCount - 7);
		this.setupPositionAdjustPattern();
		this.setupTimingPattern();
		this.setupTypeInfo(test, maskPattern);
		
		if (this.typeNumber >= 7) {
			this.setupTypeNumber(test);
		}
	
		if (this.dataCache === null) {
			this.dataCache = QRCode.createData(this.typeNumber, this.errorCorrectLevel, this.dataList);
		}
	
		this.mapData(this.dataCache, maskPattern);
	},

	setupPositionProbePattern : function(row, col)  {
		
		for (var r = -1; r <= 7; r++) {
			
			if (row + r <= -1 || this.moduleCount <= row + r) continue;
			
			for (var c = -1; c <= 7; c++) {
				
				if (col + c <= -1 || this.moduleCount <= col + c) continue;
				
				if ( (0 <= r && r <= 6 && (c === 0 || c === 6) ) || 
                     (0 <= c && c <= 6 && (r === 0 || r === 6) ) || 
                     (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
					this.modules[row + r][col + c] = true;
				} else {
					this.modules[row + r][col + c] = false;
				}
			}		
		}		
	},
	
	getBestMaskPattern : function() {
	
		var minLostPoint = 0;
		var pattern = 0;
	
		for (var i = 0; i < 8; i++) {
			
			this.makeImpl(true, i);
	
			var lostPoint = QRUtil.getLostPoint(this);
	
			if (i === 0 || minLostPoint >  lostPoint) {
				minLostPoint = lostPoint;
				pattern = i;
			}
		}
	
		return pattern;
	},
	
	createMovieClip : function(target_mc, instance_name, depth) {
	
		var qr_mc = target_mc.createEmptyMovieClip(instance_name, depth);
		var cs = 1;
	
		this.make();

		for (var row = 0; row < this.modules.length; row++) {
			
			var y = row * cs;
			
			for (var col = 0; col < this.modules[row].length; col++) {
	
				var x = col * cs;
				var dark = this.modules[row][col];
			
				if (dark) {
					qr_mc.beginFill(0, 100);
					qr_mc.moveTo(x, y);
					qr_mc.lineTo(x + cs, y);
					qr_mc.lineTo(x + cs, y + cs);
					qr_mc.lineTo(x, y + cs);
					qr_mc.endFill();
				}
			}
		}
		
		return qr_mc;
	},

	setupTimingPattern : function() {
		
		for (var r = 8; r < this.moduleCount - 8; r++) {
			if (this.modules[r][6] !== null) {
				continue;
			}
			this.modules[r][6] = (r % 2 === 0);
		}
	
		for (var c = 8; c < this.moduleCount - 8; c++) {
			if (this.modules[6][c] !== null) {
				continue;
			}
			this.modules[6][c] = (c % 2 === 0);
		}
	},
	
	setupPositionAdjustPattern : function() {
	
		var pos = QRUtil.getPatternPosition(this.typeNumber);
		
		for (var i = 0; i < pos.length; i++) {
		
			for (var j = 0; j < pos.length; j++) {
			
				var row = pos[i];
				var col = pos[j];
				
				if (this.modules[row][col] !== null) {
					continue;
				}
				
				for (var r = -2; r <= 2; r++) {
				
					for (var c = -2; c <= 2; c++) {
					
						if (Math.abs(r) === 2 || 
                            Math.abs(c) === 2 ||
                            (r === 0 && c === 0) ) {
							this.modules[row + r][col + c] = true;
						} else {
							this.modules[row + r][col + c] = false;
						}
					}
				}
			}
		}
	},
	
	setupTypeNumber : function(test) {
	
		var bits = QRUtil.getBCHTypeNumber(this.typeNumber);
        var mod;
	
		for (var i = 0; i < 18; i++) {
			mod = (!test && ( (bits >> i) & 1) === 1);
			this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
		}
	
		for (var x = 0; x < 18; x++) {
			mod = (!test && ( (bits >> x) & 1) === 1);
			this.modules[x % 3 + this.moduleCount - 8 - 3][Math.floor(x / 3)] = mod;
		}
	},
	
	setupTypeInfo : function(test, maskPattern) {
	
		var data = (this.errorCorrectLevel << 3) | maskPattern;
		var bits = QRUtil.getBCHTypeInfo(data);
        var mod;
	
		// vertical		
		for (var v = 0; v < 15; v++) {
	
			mod = (!test && ( (bits >> v) & 1) === 1);
	
			if (v < 6) {
				this.modules[v][8] = mod;
			} else if (v < 8) {
				this.modules[v + 1][8] = mod;
			} else {
				this.modules[this.moduleCount - 15 + v][8] = mod;
			}
		}
	
		// horizontal
		for (var h = 0; h < 15; h++) {
	
			mod = (!test && ( (bits >> h) & 1) === 1);
			
			if (h < 8) {
				this.modules[8][this.moduleCount - h - 1] = mod;
			} else if (h < 9) {
				this.modules[8][15 - h - 1 + 1] = mod;
			} else {
				this.modules[8][15 - h - 1] = mod;
			}
		}
	
		// fixed module
		this.modules[this.moduleCount - 8][8] = (!test);
	
	},
	
	mapData : function(data, maskPattern) {
		
		var inc = -1;
		var row = this.moduleCount - 1;
		var bitIndex = 7;
		var byteIndex = 0;
		
		for (var col = this.moduleCount - 1; col > 0; col -= 2) {
	
			if (col === 6) col--;
	
			while (true) {
	
				for (var c = 0; c < 2; c++) {
					
					if (this.modules[row][col - c] === null) {
						
						var dark = false;
	
						if (byteIndex < data.length) {
							dark = ( ( (data[byteIndex] >>> bitIndex) & 1) === 1);
						}
	
						var mask = QRUtil.getMask(maskPattern, row, col - c);
	
						if (mask) {
							dark = !dark;
						}
						
						this.modules[row][col - c] = dark;
						bitIndex--;
	
						if (bitIndex === -1) {
							byteIndex++;
							bitIndex = 7;
						}
					}
				}
								
				row += inc;
	
				if (row < 0 || this.moduleCount <= row) {
					row -= inc;
					inc = -inc;
					break;
				}
			}
		}
		
	}

};

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

window.qrcode = function(type, ecl){
  return new QRCode(type|0, QRErrorCorrectLevel[ecl] !== undefined ? QRErrorCorrectLevel[ecl] : QRErrorCorrectLevel.H);
};

  body:[
    {t:'callout', v:'Your cat has had a very big week. Somewhere in it were a street or a surrendered home, a shelter, a carrier and a car. The first two days are about turning the volume down on all of it.'},
    {t:'h', v:'Pick one room before you open the carrier'},
    {t:'p', v:'Cats read a whole house as territory to be defended, which is exhausting when none of it is familiar. One quiet room is far kinder. Put the litter box in one corner, food and water well away from it, a bed, and something to hide under or inside. Then set the carrier down, open the door, and leave it open.'},
    {t:'p', v:'Do not tip them out, and do not go looking for them under the bed. Sit on the floor, stay low, talk quietly, and let curiosity do the work. A cat who spends the first evening behind the sofa is behaving completely normally.'},
    {t:'h', v:'The three signs that it is working'},
    {t:'p', v:'Forget how affectionate they are for now and watch for these instead. They are eating. They are drinking. They are using the litter box. Once all three are steady, your cat has decided the room is safe.'},
    {t:'p', v:'Some cats get there in two days. Some take two months. Neither says anything about how the next fifteen years will go.'},
    {t:'h', v:'Opening up the rest of the house'},
    {t:'p', v:'When they are relaxed in that room, just open the door and walk away. Let them map the house at their own speed. Leave the room set up exactly as it was — for months, if you can. Every cat does better knowing there is one place that is unarguably theirs.'},
    {t:'callout', style:'blue', v:'Two things in your folder expire in 7 days: the free vet exam and the free 30-day insurance. Both are on your plan with dates already worked out.'},
    {t:'h', v:'Making the first vet trip easier'},
    {t:'p', v:'A clinic is loud, bright and full of strangers and dogs. Leave the carrier out at home with a blanket in it so it stops being a thing that only appears before bad days. Bring treats. Cover the carrier with a towel in the waiting room.'}

  sub:'The short list that actually matters',
  body:[
    {t:'h', v:'Food, and how to change it'},
    {t:'p', v:'The shelter will tell you what your cat has been eating. If you want to switch brands, do it over about ten days rather than overnight: roughly a quarter new food at first, then half, then three quarters, then all of it. A slow change keeps their digestion — and their litter box — uneventful.'},
    {t:'h', v:'Water'},
    {t:'p', v:'Fresh, always available, and not right next to the food. Some cats drink far more from a moving fountain than a still bowl, which is worth knowing because cats are chronically under-hydrated. If you use a fountain, clean it properly and often.'},
    {t:'h', v:'Litter boxes — buy one more than you think'},
    {t:'p', v:'One box per cat, plus one. Two boxes for a single cat. Put them in different parts of the home rather than side by side, so a nervous cat is never cornered on the way to the only toilet.'},
    {t:'l', v:[
      'Big enough that the whole cat fits and can turn around with nothing hanging over the edge.',
      'Skip the hood. It traps smell and it lets another animal wait outside where your cat cannot see them.',
      'Pick a fine-grained litter and then stop experimenting. Cats form firm opinions about this.',
      'Scoop daily. Most litter box problems are a review of the housekeeping.'
    ]},
    {t:'h', v:'Somewhere to scratch'},
    {t:'p', v:'Scratching is maintenance, not misbehaviour — it sheds claw sheaths, stretches the back and leaves scent. The only real question is what gets scratched. Offer both a tall vertical post and a flat horizontal pad, put them where your cat actually spends time rather than in the spare room, and the sofa stops being the best option available.'},
    {t:'callout', v:'The shelter does not support declawing. It removes the last bone of each toe, not just the claw, and it commonly trades a scratched armchair for a cat who bites or stops using the litter box.'},
    {t:'h', v:'Height'},
    {t:'p', v:'A tower, a shelf or a cleared windowsill. Vertical space is extra territory, and in a home with more than one animal it is what stops the floor becoming contested ground.'},
    {t:'h', v:'Toys'},
    {t:'p', v:'A wand toy is the one thing worth buying properly. Beyond that, cats are famously unimpressed by price. Keep a handful in a drawer and rotate them weekly so nothing is ever quite boring.'}
  ]
},
{
  id:'reading', cat:'Understand', icon:'heart', mins:5,
  title:'Reading your cat',
  sub:'Three states, and what to do in each',
  body:[
    {t:'p', v:'Cats talk constantly and almost none of it is out loud. Ears, tail, pupils, posture and where they choose to be tell you what you need to know. The single most useful habit is describing what you can see — "ears flat, tail tucked, pupils huge" — instead of reaching for a word like moody. A description tells you what to do next. A label does not.'},
    {t:'p', v:'Almost everything you will see falls into one of three states.'},
    {t:'zone', style:'g', art:'loaf', h:'Settled', p:'Loose, unbothered, taking up space. This is the state you are trying to build more of.', d:[
      ['What it looks like','Body relaxed or stretched out, tail still or slowly swaying, ears forward, pupils normal, eyes half closed. Sometimes a slow blink, which is as close to a compliment as cats give.'],
      ['What to do','Nothing. Sit near them, blink slowly back, and let it be uneventful. Time spent boring is time spent building trust.']
    ]},
    {t:'zone', style:'y', art:'crouch', h:'Uneasy', p:'Alert and not enjoying it. Nothing has gone wrong yet, and this is the moment where you can stop it going wrong.', d:[
      ['What it looks like','Body low or shifted away, head turned aside, tail close to the body and flicking, ears rotating out to the sides, pupils widening. Very still, or suddenly grooming in an oddly intense way.'],
      ['What to do','Find the trigger and remove it, or move your cat away from it. Give them a route out and a place to hide. Do not follow, do not pick them up, and do not try to reassure them by getting closer.']
    ]},
    {t:'zone', style:'r', art:'arch', h:'Overwhelmed', p:'Past the point of coping. A cat here may lash out, and that is fear rather than aggression.', d:[
      ['What it looks like','Pupils fully round and black, ears flat back or sideways, tail tucked or bottle-brushed, body either flattened or arched with the fur up. Growling, hissing, spitting.'],
      ['What to do','Take the trigger away — the dog, the visitor, the noise. If you cannot, leave the room and let them find their own way to somewhere quiet. Never corner them, never grab them, never punish. Give it hours, not minutes.']
    ]},
    {t:'callout', style:'blue', v:'A cat who hisses is not being difficult. Hissing is a warning issued instead of a bite, and it deserves a thank-you and some distance.'},
    {t:'h', v:'The same thing, part by part'},
    {t:'p', v:'If you would rather read it as a checklist than a description, this is every signal broken out.'},
    {t:'pose', art:'loaf', h:'Resting', p:'Settled', d:[
      ['Eyes','Closed to half open, slow blinking'],['Ears','Normal or gently forward'],
      ['Tail','Wrapped loosely or extended'],['Body','On the belly or side, no tension'],['Sounds','Silence or purring']]},
    {t:'pose', art:'sit', h:'Perked and interested', p:'Settled', d:[
      ['Eyes','Looking directly, not hard'],['Ears','Forward'],
      ['Tail','Close to the body, may flick'],['Body','Upright, back horizontal'],['Sounds','Quiet, or a chirp']]},
    {t:'pose', art:'walk', h:'Exploring', p:'Settled', d:[
      ['Eyes','Open, scanning'],['Ears','Normal or perked'],
      ['Tail','Up and winding, or loosely down'],['Body','Back horizontal, moving freely'],['Sounds','None, or a meow']]},
    {t:'pose', art:'crouch', h:'Mildly anxious', p:'Uneasy', d:[
      ['Eyes','Wide, avoiding eye contact, pupils widening'],['Ears','Rotating out to the sides'],
      ['Tail','Close to the body, flicking'],['Body','Low, shifted away, head turned aside'],['Sounds','None']]},
    {t:'pose', art:'stalk', h:'Trying to leave', p:'Uneasy', d:[
      ['Eyes','Pupils dilated'],['Ears','Back or sideways'],
      ['Tail','Tight to the body, hair lifting'],['Body','Low and poised to move, weight back'],['Sounds','None, meow, or a hiss']]},
    {t:'pose', art:'arch', h:'Fight or flight', p:'Overwhelmed', d:[
      ['Eyes','Fully round and black'],['Ears','Flat back, or forward and hard'],
      ['Tail','Tucked or bottle-brushed'],['Body','Flattened, or arched with the fur up'],['Sounds','Growling, hissing, spitting']]},
    {t:'h', v:'When to call someone'},
    {t:'p', v:'A sudden change is worth a vet visit before it is worth a trainer. Cats hide pain extremely well, and a cat who has started hiding, stopped eating, or begun missing the litter box is often telling you something medical first.'}
  ]

{
  id:'play', cat:'Understand', icon:'sparkle', mins:4, art:'pounce',
  title:'Play, and why it fixes things',
  sub:'Ten minutes a day changes the whole animal',
  body:[
    {t:'p', v:'A toy lying on the carpet is, to a cat, a dead thing. Play only works when it behaves like something alive: small, quiet, moving away, occasionally hiding. What you are staging is a hunt, and the hunt is what gets used up.'},
    {t:'p', v:'It is also how you bond with a cat who does not want to be held. Plenty of cats will never be lap cats and will still adore the person on the other end of the wand.'},
    {t:'h', v:'Find out what your cat hunts'},
    {t:'p', v:'Most cats have a strong preference. Work through these and watch for the one that switches them on:'},
    {t:'l', v:[
      'Birds — feathers on a wand, moving in arcs above the ground and landing occasionally.',
      'Mice — something small dragged along the floor, away from your cat and around corners.',
      'Bugs — a light toy on a wire, twitched in small jerks. Often the winner for shy cats.',
      'Snakes — a ribbon or frayed rope pulled in a straight line along the ground.'
    ]},
    {t:'chart', v:[
      ['stalk','The stalk','Low and slow, eyes locked'],
      ['crouch','The wait','Frozen, deciding'],
      ['pounce','The pounce','Rear wiggle, then go'],
      ['groom','The reset','Catch, then a wash']
    ]},
    {t:'h', v:'Six things that make it work'},
    {t:'l', v:[
      'Move it away from your cat, never towards them. Prey flees.',
      'Change speed. Long pauses and barely-moving are more exciting than constant motion.',
      'Let it disappear under a rug or behind a chair. Rustling is half the appeal.',
      'Keep it a few feet away — cats focus badly on things right under their nose.',
      'Make them wait. Too easy is boring.',
      'End with a catch. A hunt with no kill leaves a cat wound up rather than satisfied.'
    ]},
    {t:'callout', v:'Laser pointers are the exception worth flagging. The dot can never be caught, and some cats become genuinely obsessive about it. If you use one, finish every session by landing the dot on a real toy they can pin down.'},
    {t:'h', v:'When to do it'},
    {t:'p', v:'Before meals and before bed. A hunt followed by food followed by sleep is the natural order of a cat\'s day, and running it deliberately is the single best fix for a cat who wakes you at four in the morning.'}
  ]
},
{
  id:'introductions', cat:'Understand', icon:'users', mins:6, art:'sit',
  title:'Meeting the other animals',
  sub:'Five stages, and the rule about not skipping any',
  body:[
    {t:'p', v:'Cats are territorial, and a resident cat did not ask for a flatmate. Done slowly, most pairs settle into somewhere between tolerance and genuine friendship. Done quickly, you can create a conflict that lasts for years. The whole method is: let them learn about each other through a closed door until the meeting is boring.'},
    {t:'p', v:'A confident young cat might need a week. An older cat who has never lived with another animal can need two months. Go at the pace of whichever animal is finding it harder.'},
    {t:'h', v:'Stage 1 — Separate'},
    {t:'p', v:'The new cat stays in the sanctuary room with the door shut. Nobody sees anybody. This alone often takes several days.'},
    {t:'h', v:'Stage 2 — Eat on either side of the door'},
    {t:'p', v:'Feed both animals near the closed door, far enough back that both can actually eat. Each day move the bowls slightly closer. You are teaching both cats that the other one\'s smell arrives with dinner. If either stops eating, you have moved too fast — go back a step.'},
    {t:'h', v:'Stage 3 — Swap scents and swap rooms'},
    {t:'p', v:'Trade blankets between them. Rub a soft cloth on one cat and leave it under the other\'s bowl. Then let the new cat explore the house while the resident cat spends time in the sanctuary room. They learn the whole map of each other without a face to attach it to.'},
    {t:'h', v:'Stage 4 — See but not reach'},
    {t:'p', v:'Crack the door and wedge it, or use a baby gate or a screen. Keep it short and end while it is still going well. Feed treats on both sides so the sight of the other cat predicts something good.'},
    {t:'h', v:'Stage 5 — Same room'},
    {t:'p', v:'Short and supervised, with an obvious exit for both. Build up by how they behave, not by the calendar. Two cats ignoring each other in the same room is a complete success.'},
    {t:'callout', v:'If a fight starts, never reach in with your hands. Make a sharp noise, or drop a blanket or a cushion between them, then separate them and go back several stages. Punishment does not work here and reliably makes things worse.'},
    {t:'h', v:'While all this is going on'},
    {t:'l', v:[
      'One litter box per cat plus one, and cleaned more often than usual.',
      'Every cat needs a hiding place and a high place the other cannot follow them to.',
      'Keep your resident cat\'s routine exactly as it was. They have lost enough already.',
      'Have both animals checked by a vet. Pain is a common hidden reason introductions stall.'
    ]},
    {t:'h', v:'Dogs'},
    {t:'p', v:'Same stages, with the dog on a lead throughout and the cat always given an escape route and high ground. The bar is a dog who can be calm and ignore the cat on command before they are ever loose in the same room together.'}
  ]
},
{
  id:'myths', cat:'Understand', icon:'book', mins:3, art:'kitten',
  title:'Five things people get wrong',
  sub:'Common advice that is not true',
  body:[
    {t:'h', v:'"Cats need milk"'},
    {t:'p', v:'Adult cats are lactose intolerant. A saucer of milk is a stomach upset with extra steps.'},
    {t:'h', v:'"A bit of tuna is fine"'},
    {t:'p', v:'As an occasional treat, mostly. As a habit, no — human food is not balanced for cats, and a tuna habit in particular displaces the nutrition they actually need. Complete commercial cat food exists precisely because getting feline nutrition right by hand is very hard.'},
    {t:'h', v:'"One of them is the alpha"'},
    {t:'p', v:'Cats do not have a pack hierarchy. Their relationships are fluid and mostly negotiated around time and space rather than rank. One cat being bolder does not make them the boss, and treating them as if it does will not resolve anything.'},
    {t:'h', v:'"Cats are low maintenance"'},
    {t:'p', v:'They are quieter than dogs and they do not need walking. They still need daily play, clean boxes, annual vet care, company, and someone to notice quickly when something is wrong.'},
    {t:'h', v:'"You cannot train a cat"'},
    {t:'p', v:'You absolutely can, with food and a marker sound. Cats learn to come when called, go into a carrier, sit on a scale and accept nail trims. Clicker training is also one of the better ways to build confidence in a fearful cat.'}
  ]

const STORE_KEY = 'firstday:record:v3';
/* Three tiers: the artifact storage API when it exists, the browser's own
   storage when the app is hosted, and memory only as a last resort. */
async function readStore(){
  try{ const r = await window.storage.get(STORE_KEY); if(r && r.value) return r.value; }catch(e){}
  try{ const v = localStorage.getItem(STORE_KEY); if(v) return v; }catch(e){}
  return null;
}
async function writeStore(v){
  try{ await window.storage.set(STORE_KEY, v); return true; }catch(e){}
  try{ localStorage.setItem(STORE_KEY, v); return true; }catch(e){}
  return false;
}
async function clearStore(){
  try{ await window.storage.delete(STORE_KEY); }catch(e){}
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
}
async function load(){
  try{
    const v = await readStore();
    if(v) S = Object.assign(JSON.parse(JSON.stringify(BLANK)), JSON.parse(v));
  }catch(e){ S = JSON.parse(JSON.stringify(BLANK)); }
}
let saveTimer;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const ok = await writeStore(JSON.stringify(S));
    if(!ok && storeOK){ storeOK = false; console.warn('Storage unavailable — this session only.'); }
  }, 250);
}

/* Downscale an uploaded photo so it fits comfortably in storage */
function readPhoto(file, cb){
  const fr = new FileReader();
  fr.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 900, sc = Math.min(1, max/Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      cb(c.toDataURL('image/jpeg', .82));
    };
    img.onerror = () => toast('That file could not be read as an image.');
    img.src = fr.result;
  };
  fr.onerror = () => toast('That file could not be read.');
  fr.readAsDataURL(file);
}

/* Calendar file — works offline, imports into any calendar app */
function ics(title, date, desc){
  const dt = d => d.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  const end = new Date(date.getTime()+3600000);
  const body = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//First Day//Seattle Animal Shelter//EN','BEGIN:VEVENT',
    'UID:'+Date.now()+'@firstday','DTSTAMP:'+dt(new Date()),'DTSTART:'+dt(date),'DTEND:'+dt(end),
    'SUMMARY:'+title.replace(/[,;]/g,''),
    'DESCRIPTION:'+String(desc||'').replace(/[,;]/g,'').replace(/\n/g,'\\n'),
    'BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:'+title.replace(/[,;]/g,''),'END:VALARM',
    'END:VEVENT','END:VCALENDAR'
  ].join('\r\n');
  download(new Blob([body],{type:'text/calendar'}), title.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.ics');
  toast('Reminder downloaded — open it to add to your calendar');
}
function download(blob, filename){
  const u = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = u; a.download = filename; document.body.appendChild(a); a.click();
  a.remove(); setTimeout(()=>URL.revokeObjectURL(u), 1000);
}

function qrSVG(text, px, kind){
  if(typeof qrcode === 'undefined'){

  try{ qr = qrcode(0,'H'); qr.addData(text); qr.make(); }
  catch(e){ return `<p class="small">That link is too long to encode. Shorten the base URL under Record.</p>`; }

  const n = qr.getModuleCount(), q = 3, tot = n + q*2, u = px/tot;
  const cx = tot/2, clear = Math.ceil(n*0.22);
  const inClear = (r,c) => Math.abs(r+q+0.5-cx) < clear/2+0.6 && Math.abs(c+q+0.5-cx) < clear/2+0.6;
  const isFinder = (r,c) =>
    (r<7 && c<7) || (r<7 && c>=n-7) || (r>=n-7 && c<7);

  let dots = '';
  for(let r=0;r<n;r++){
    for(let c=0;c<n;c++){
      if(!qr.isDark(r,c) || isFinder(r,c) || inClear(r,c)) continue;
      const x = (c+q)*u, y = (r+q)*u;
      dots += `<rect x="${(x+u*0.09).toFixed(2)}" y="${(y+u*0.09).toFixed(2)}" width="${(u*0.82).toFixed(2)}" height="${(u*0.82).toFixed(2)}" rx="${(u*0.3).toFixed(2)}"/>`;
    }
  }
  const eye = (r,c) => {
    /* Outer ring is exactly 1 module thick and sits inside the 7x7 cell,
       so the stroke covers the ring rather than straddling its edge. */
    const x=(c+q)*u, y=(r+q)*u;
    return `<rect x="${(x+u/2).toFixed(2)}" y="${(y+u/2).toFixed(2)}" width="${(u*6).toFixed(2)}" height="${(u*6).toFixed(2)}" rx="${(u*0.55).toFixed(2)}" fill="none" stroke="var(--fir)" stroke-width="${u.toFixed(2)}"/>
            <rect x="${(x+u*2).toFixed(2)}" y="${(y+u*2).toFixed(2)}" width="${(u*3).toFixed(2)}" height="${(u*3).toFixed(2)}" rx="${(u*0.4).toFixed(2)}" fill="var(--fir)"/>`;
  };
  /* The white plate must not spill past the modules we actually cleared. */
  const plate = (clear+1)*u, art = plate*0.94;

  return `<svg viewBox="0 0 ${px} ${px}" width="${px}" height="${px}" role="img" aria-label="QR code linking to this pet's shelter record">
    <rect width="${px}" height="${px}" fill="#fff" rx="${(px*0.05).toFixed(0)}"/>
    <g fill="var(--fir)">${dots}</g>
    ${eye(0,0)}${eye(0,n-7)}${eye(n-7,0)}
    <rect x="${((px-plate)/2).toFixed(2)}" y="${((px-plate)/2).toFixed(2)}" width="${plate.toFixed(2)}" height="${plate.toFixed(2)}" rx="${(u*1.6).toFixed(2)}" fill="#fff"/>
    <g transform="translate(${((px-art)/2).toFixed(2)},${((px-art)/2).toFixed(2)}) scale(${(art/120).toFixed(4)})">
      ${(kind==='cat'?catOnlySVG(120,'var(--fir)','q'+Math.random().toString(36).slice(2,6))
         :kind==='dog'?dogOnlySVG(120,'var(--fir)','q'+Math.random().toString(36).slice(2,6))
         :markSVG(120,'var(--fir)','#fff','qr'+Math.random().toString(36).slice(2,6))).replace(/<svg[^>]*>|<\/svg>/g,'')}
    </g>
  </svg>`;
}
/* The code has to open THIS app, not the shelter's website. When the file is
   served over http(s) that is just its own URL, so scanning it anywhere opens
   the folder. Opened straight off a disk there is no shareable URL, so the
   code carries the pet's record as text instead and says so on screen. */
function appURL(){
  if(S.base && S.base.trim()) return S.base.trim() + (S.pet.id || '');
  const l = location;
  if(l.protocol === 'http:' || l.protocol === 'https:'){
    return l.origin + l.pathname + (S.pet.id ? '#pet=' + encodeURIComponent(S.pet.id) : '');
  }
  return null;
}
function qrMode(){ return appURL() ? 'link' : 'record'; }
function qrPayload(){
  const u = appURL();
  if(u) return u;
  const p = S.pet;
  return ['SEATTLE ANIMAL SHELTER — adoption record',
    petName(), p.id?('Animal ID '+p.id):'', p.microchip?('Microchip '+p.microchip):'',
    [p.breed,p.age,p.sex].filter(Boolean).join(', '),
    'Rabies: '+({yes:'given at shelter',no:'NOT given',unknown:'unconfirmed'}[p.rabies]||'unconfirmed'),
    S.owner.name?('Owner '+S.owner.name):'', S.owner.phone||'',
    'Adopted '+fmtDate(adoptDate())
  ].filter(Boolean).join('\n');
}

function render(){
  const root = $('#root');

  if(S.screen === 'welcome')        body = viewWelcome();
  else if(S.screen === 'setup')     body = viewSetup();
  else if(S.screen === 'celebrate') body = viewCelebrate();
  else if(S.screen === 'perks')     body = viewPerks();
  else if(S.screen === 'review')    body = viewReview();
  else if(S.screen === 'doc')       body = viewDoc(S.docId);
  else                              body = viewApp();
  /* The nav rides along on every stage except the celebration, which is
     deliberately a full-bleed moment. */
  root.innerHTML = (S.screen === 'celebrate' ? '' : navBar()) + body;
  const sc = $('.screen');
  if(sc) sc.addEventListener('scroll', () => {
    const tb = $('.topbar'); if(tb) tb.classList.toggle('stuck', sc.scrollTop > 6);
  }, {passive:true});
  if(S.screen === 'celebrate') confetti();
}

function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const b = $('#burst'); if(!b) return;
  const cols = ['#F0B429','#FBE3A1','#5FA544','#FFFFFF','#E49B41','#7ED0C4','#1B75BB'];
  let h = '';
  for(let i=0;i<44;i++){
    const dx = (Math.random()*180-90).toFixed(0), rot = (Math.random()*900-450).toFixed(0);
    const dur = (2.4+Math.random()*2).toFixed(2), del = (Math.random()*1.3).toFixed(2);
    const left = (Math.random()*100).toFixed(1), c = cols[i%cols.length];
    const round = Math.random()>.6 ? 'border-radius:50%;height:9px' : '';
    h += `<i class="conf" style="left:${left}%;background:${c};--dx:${dx}px;--rot:${rot}deg;${round};animation:fall ${dur}s ${del}s cubic-bezier(.25,.6,.5,1) forwards"></i>`;
  }
  b.innerHTML = h;
}

const TABS = [
  ['start','Start','qr'], ['home','Home','home'], ['care','Folder','book'],
  ['plan','Plan','checkbox'], ['nearby','Nearby','pin'], ['record','Record','file']
];
function navBar(){
  const openCount = TASKS.filter(x=>!S.tasks[x.id] && dueDate(x.due) < Date.now()+3*DAY).length;
  const cur = S.screen==='welcome' ? 'start'
            : S.screen==='app' ? S.tab
            : S.screen==='doc' ? 'care'
            : S.screen==='review' ? 'record'
            : S.screen==='perks' ? 'nearby' : '';

}

function viewApp(){
  return {home:tabHome, care:tabCare, plan:tabPlan, nearby:tabNearby, record:tabRecord}[S.tab]();
}

function topbar(title, right=''){
  return `<div class="topbar"><div class="topbar-row"><h1>${title}</h1>${right}</div></div>`;
}

/* ---------------- CARE LIBRARY ---------------- */
function tabCare(){

  let list = '';
  if(active === 'Links'){
    list = LINKS.map(g=>`<div class="sec-head"><h2>${g.g}</h2></div>
      <div class="card link-list">${g.items.map(([t,u])=>`<a href="${u}" target="_blank" rel="noopener">${esc(t)}${ICON.ext}</a>`).join('')}</div>`).join('');
  } else if(active === 'Watch'){
    list = `<p class="small" style="margin:16px 0 12px">These open a YouTube search rather than one fixed video, so the results stay current and nothing here ever goes dead.</p>
      <div class="stack">${VIDEOS.map(v=>`<a class="doc-item" href="https://www.youtube.com/results?search_query=${encodeURIComponent(v.q)}" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">
        <span class="doc-ico" style="background:#FBE9E7;color:#C0392B">${ICON.play}</span>
        <span style="flex:1"><b>${esc(v.t)}</b><span class="small">${esc(v.by)}</span></span>
        <span style="color:var(--muted);width:16px;flex:none">${ICON.ext}</span></a>`).join('')}</div>`;

function docRow(d){
  const rev = REVIEW.find(r => r[2] === d.id);

    </span>

}

/* ---------------- DOC READER ---------------- */
function viewDoc(id){
  const d = DOCS.find(x=>x.id===id); if(!d) return viewApp();
  const rev = REVIEW.find(r=>r[2]===id);
  const html = d.body.map(b=>{
    if(b.t==='h') return `<h3>${esc(b.v)}</h3>`;
    if(b.t==='p') return `<p>${esc(b.v)}</p>`;
    if(b.t==='l') return `<ul>${b.v.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
    if(b.t==='callout') return `<div class="callout ${b.style==='blue'?'blue':''}">${esc(b.v)}</div>`;
    if(b.t==='zone') return `<div class="zone zone-${b.style}">${b.art?`<div class="art">${art(b.art,86)}</div>`:''}<h4>${esc(b.h)}</h4><p>${esc(b.p)}</p><dl>${b.d.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl></div>`;
    if(b.t==='chart') return `<div class="chart">${b.v.map(([pose,label,sub])=>
        `<figure>${art(pose,72)}<figcaption>${esc(label)}${sub?`<em>${esc(sub)}</em>`:''}</figcaption></figure>`).join('')}</div>`;
    if(b.t==='pose') return `<div class="pose">
        <div class="top">${art(b.art,60)}<div><h5>${esc(b.h)}</h5><div class="sig">${esc(b.p)}</div></div></div>
        <table>${b.d.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('')}</table></div>`;
    if(b.t==='cert'){
      const p=S.pet,o=S.owner;
      const f=(k,v)=>`<div class="cf"><dt>${k}</dt><dd>${esc(v||'—')}</dd></div>`;
      return `<div class="cert">
        <h4>Certificate for a free health examination</h4>
        <div class="issuer">Donated as a community service by the members of the Washington State Veterinary Medical Association, through the Washington State Animal Health Foundation.</div>
        <dl>
          ${f('Agency adopted from','Seattle Animal Shelter')}
          ${f('Date adopted',fmtDate(adoptDate()))}
          ${f('Pet name',petName())}
          ${f('Breed',p.breed)}${f('Age',p.age)}${f('Sex',p.sex)}
          ${f('Microchip no.',p.microchip)}
          ${f('Owner',o.name)}${f('Phone',o.phone)}
          ${f('Address',[o.address,o.city,o.state,o.zip].filter(Boolean).join(', '))}
        </dl>
        <div class="cut"><p class="tiny" style="margin:0">Valid for one physical examination during regular office hours with a participating WSVMA member veterinarian. Not valid for treatment, hospitalisation, vaccinations, emergency care or medication.</p></div>
      </div>`;
    }
    if(b.t==='notice'){
      const r=S.pet.rabies;
      return `<div class="notice" style="background:var(--sound-2);border-color:#CFE0E8">
        <b style="font-size:14.5px">Public Health — Seattle &amp; King County</b>
        <p class="small" style="margin:5px 0 0;color:#2B5568">Your new pet has / has not received a rabies vaccination while at the Seattle Animal Shelter.</p>
        <div class="haswrap">
          <div class="hasbox ${r==='yes'?'on ok':''}"><b>HAS</b><span>Given at the shelter</span></div>
          <div class="hasbox ${r==='no'?'on':''}"><b>HAS NOT</b><span>Your responsibility</span></div>
        </div>
        <p class="tiny" style="margin:0;color:#2B5568">${r==='unknown'?'Not yet recorded — set this under Record so your plan is accurate.':r==='yes'?'Booster due one year from the vaccination date.':'Arrange the vaccination with any vet or clinic. It is on your Plan.'}</p>
      </div>`;
    }
    if(b.t==='profile'){
      const p=S.pet;
      const f=(k,v)=>v?`<div class="rec"><dt>${k}</dt><dd>${esc(v)}</dd></div>`:'';
      return `<div class="profile">
        <div class="ph">${p.photo?`<img class="avatar" style="width:56px;height:56px;border-radius:14px" src="${p.photo}" alt="">`:''}
          <div><h4>Meet ${esc(petName())}</h4><div class="small">Animal ID ${esc(p.id||'—')}</div></div></div>
        <div class="pb"><dl style="margin:0">
          ${f('Shelter name',p.shelterName)}${f('Species',p.species)}${f('Breed',p.breed)}
          ${f('Age at adoption',p.age)}${f('Sex',p.sex)}${f('Colour',p.color)}${f('Weight',p.weight)}
          ${f('Microchip',p.microchip)}${f('Spayed / neutered',{yes:'Yes',no:'Not yet',unknown:'Needs checking'}[p.altered])}
        </dl></div></div>`;
    }
    if(b.t==='story') return S.pet.story
        ? `<h3>How they came to the shelter</h3><p>${esc(S.pet.story)}</p>`
        : `<div class="callout">No shelter history saved yet. Ask your rep for it and add it under Record — it is the part that disappears if you lose the paperwork.</div>`;
    if(b.t==='src') return `<div class="srcline">${esc(b.v)}${b.link?` <a href="${b.link}" target="_blank" rel="noopener">Open the original</a>`:''}</div>`;
    return '';
  }).join('');
  return `<div class="topbar"><div class="topbar-row">
      <button class="back" data-a="closedoc" aria-label="Back to care">${ICON.chevL}</button>
      <h1 style="font-size:17px">${esc(d.cat)}</h1>
    </div></div>
    <div class="screen"><div class="pad" style="padding-top:10px">
      <h1 style="font-size:27px;line-height:1.14">${esc(d.title)}</h1>
      <p class="small" style="margin:9px 0 18px">${esc(d.sub)} · ${d.mins} minute read</p>
      ${d.art?`<div class="doc-hero"><div class="art">${art(d.art,112)}</div></div>`:''}
      <div class="reader">${html}</div>
      ${rev?`<button class="reviewbar ${S.acks[rev[0]]?'on':''}" data-ack="${rev[0]}" style="width:100%;text-align:left">
        <span class="box" style="${S.acks[rev[0]]?'background:var(--ok);border-color:var(--ok)':''}">${S.acks[rev[0]]?ICON.check:''}</span>
        <span style="flex:1"><b style="font-size:14.5px;display:block">${S.acks[rev[0]]?'Reviewed at the shelter':'Mark as reviewed with me'}</b>
        <span class="small">${S.acks[rev[0]]?'This page is checked off on your receipt':'Tap when the shelter rep has gone through this page with you'}</span></span>
      </button>`:''}
      <div class="pad-b" style="padding-bottom:40px"></div>
    </div></div>`;
}

      <p class="small" style="margin:6px 0 12px">Downloads one file with every dated item, each with a reminder the day before.</p>
      <button class="btn btn-2 btn-s" data-a="icsall">${ICON.cal}<span>Download all reminders</span></button>

function taskRow(t, full){
  const done = !!S.tasks[t.id], dl = dueLabel(t.due);
  const acts = [];
  if(t.doc) acts.push(`<button data-doc="${t.doc}">${ICON.book}<span>Read</span></button>`);
  if(t.due>0) acts.push(`<button data-ics="${t.id}">${ICON.cal}<span>Remind me</span></button>`);
  if(t.act && t.act.startsWith('dir:')){
    const org = DIRECTORY.find(o=>o.id===t.act.slice(4));
    if(org && org.tel) acts.push(`<a href="tel:${org.tel}">${ICON.phone}<span>Call</span></a>`);
    if(org && org.url) acts.push(`<a href="${org.url}" target="_blank" rel="noopener">${ICON.ext}<span>Open</span></a>`);
  }
  if(t.act === 'photo') acts.push(`<button data-a="pick" data-k="dayOnePhoto">${ICON.cam}<span>Add photo</span></button>`);
  if(t.act && t.act.startsWith('tab:')) acts.push(`<button data-tab="${t.act.slice(4)}">${ICON.pin}<span>Open</span></button>`);
  if(t.act && t.act.startsWith('perk:')) acts.push(`<button data-a="perks">${ICON.gift}<span>Details</span></button>`);
  return `<div class="task ${done?'done':''}">
    <button class="box" data-check="${t.id}" aria-pressed="${done}" aria-label="Mark ${esc(t.t)} ${done?'not done':'done'}">${done?ICON.check:''}</button>
    <div class="t-body">
      <div class="t-title">${esc(t.t)}</div>
      <div class="t-meta">
        <span class="pill ${done?'pill-ok':dl.cls}">${done?'Done':dl.txt}</span>
        ${t.hard&&!done?`<span class="pill pill-rust">Hard deadline</span>`:''}
      </div>
      ${full!==true && !done ? '' : `<p class="t-why">${esc(t.why)}</p>`}
      ${done?'':`<div class="t-act">${acts.join('')}</div>`}
    </div>
  </div>`;
}

function summaryText(){
  const p=S.pet,o=S.owner;
  const L=[];
  L.push(`${petName()} — adoption record`);
  L.push(`Seattle Animal Shelter, adopted ${fmtDate(adoptDate())}`);
  L.push('');
  if(p.shelterName && p.shelterName!==p.name) L.push(`Shelter name: ${p.shelterName}`);
  [['Animal ID',p.id],['Microchip',p.microchip],['Species',p.species],['Breed',p.breed],['Colour',p.color],
   ['Sex',p.sex],['Age at adoption',p.age],['Weight',p.weight]].forEach(([k,v])=>{ if(v) L.push(`${k}: ${v}`); });
  L.push(`Rabies: ${{yes:'given at the shelter',no:'NOT given at the shelter',unknown:'unconfirmed'}[p.rabies]}`);
  L.push(`Spayed/neutered: ${{yes:'yes',no:'not yet',unknown:'unconfirmed'}[p.altered]}`);
  L.push('');
  if(o.name) L.push(`Owner: ${o.name}${o.phone?` · ${o.phone}`:''}`);
  if(o.address) L.push(`Address: ${[o.address,o.city,o.state,o.zip].filter(Boolean).join(', ')}`);
  if(S.vet.name) L.push(`Vet: ${S.vet.name}${S.vet.phone?` · ${S.vet.phone}`:''}`);
  if(S.staff.signedAt) L.push(`\nDocuments reviewed by ${S.staff.name} on ${fmtDateTime(new Date(S.staff.signedAt))}.`);
  L.push(`\n${qrPayload()}`);
  return L.join('\n');
}
async function doShare(){
  const text = summaryText();
  if(navigator.share){
    try{ await navigator.share({title:`${petName()} — adoption record`, text}); return; }catch(e){ if(e.name==='AbortError') return; }
  }
  try{ await navigator.clipboard.writeText(text); toast('Record copied to your clipboard'); }
  catch(e){ sheet(`<h2>Record summary</h2><textarea class="inp" style="min-height:280px;font-size:13px;margin-top:12px">${esc(text)}</textarea><button class="btn" data-a="closesheet" style="margin-top:12px">Done</button>`); }
}
function doExport(){

  <style>body{font-family:Georgia,serif;max-width:44em;margin:44px auto;padding:0 22px;line-height:1.55;color:#14201D}
