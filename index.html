function icsAll(){
  const dt = d => d.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  const ev = TASKS.filter(t=>t.due>0 && !S.tasks[t.id]).map((t,i)=>{
    const d = dueDate(t.due); d.setHours(10,0,0,0);
    return ['BEGIN:VEVENT','UID:'+Date.now()+i+'@firstday','DTSTAMP:'+dt(new Date()),'DTSTART:'+dt(d),'DTEND:'+dt(new Date(d.getTime()+3600000)),
      'SUMMARY:'+petName()+' — '+t.t.replace(/[,;]/g,''),'DESCRIPTION:'+t.why.replace(/[,;]/g,''),
      'BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:'+t.t.replace(/[,;]/g,''),'END:VALARM','END:VEVENT'].join('\r\n');
  }).join('\r\n');
  download(new Blob(['BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//First Day//EN\r\n'+ev+'\r\nEND:VCALENDAR'],{type:'text/calendar'}), 'first-year-reminders.ics');
  toast('Calendar file downloaded');
}
/* =============================================================
   EVENTS
   ============================================================= */
function setPath(path, val){
  const parts = path.split('.');
  if(parts.length===1) S[parts[0]] = val;
  else S[parts[0]][parts[1]] = val;
  save();
}

/* Buttons gated on a text field have to unlock as you type — re-rendering
   the whole screen here would blur the input mid-word. */
function refreshGates(){
  const sign = document.querySelector('[data-a="sign"]');
  if(sign) sign.disabled = !(S.staff.name||'').trim();
  const conf = document.querySelector('[data-a="confirm"]');
  if(conf) conf.disabled = !((S.owner.name||'').trim() && REVIEW.every(([k])=>S.acks[k]));
}
document.addEventListener('input', e => {
  const f = e.target.closest('[data-f]'); if(!f) return;
  setPath(f.dataset.f, f.value);
  const live = document.querySelector('.sheet .small span');
  if(f.dataset.f === 'base' && live) live.textContent = qrPayload();
  refreshGates();
});

document.addEventListener('change', e => {
  if(e.target.id === 'filein' && e.target.files[0]){
    const key = e.target.dataset.k || 'photo';
    readPhoto(e.target.files[0], data => { S.pet[key] = data; save(); render(); toast('Photo saved'); });
    e.target.value = '';
  }
});

document.addEventListener('click', e => {
  const t = e.target.closest('[data-a],[data-tab],[data-doc],[data-cat],[data-check],[data-ack],[data-ics],[data-set]');
  if(!t) return;
  const a = t.dataset;

  /* nav */
  if(a.tab){
    if(a.tab === 'start'){ S.screen='welcome'; save(); render(); const w=$('.screen'); if(w) w.scrollTop=0; return; }
    S.tab = a.tab; S.screen='app'; save(); render(); const sc=$('.screen'); if(sc) sc.scrollTop=0; return;
  }
  if(a.doc){ S.docFrom = (S.screen==='review'||S.screen==='welcome') ? S.screen : 'app'; S.docId = a.doc; S.screen='doc'; render(); return; }
  if(a.cat){ S.careCat = a.cat; render(); return; }

  /* toggles */
  if(a.check){ S.tasks[a.check] = !S.tasks[a.check]; save(); render();
    if(S.tasks[a.check]) toast(TASKS.filter(x=>S.tasks[x.id]).length===TASKS.length ? 'Every item done. Nicely handled.' : 'Done'); return; }
  if(a.ack){ S.acks[a.ack] = !S.acks[a.ack]; save(); render();
    if(S.acks[a.ack] && REVIEW.every(([k])=>S.acks[k])) toast('Every page reviewed'); return; }
  if(a.set){ setPath(a.set, a.val); render(); return; }
  if(a.ics){
    const task = TASKS.find(x=>x.id===a.ics); const d = dueDate(task.due); d.setHours(10,0,0,0);
    ics(`${petName()} — ${task.t}`, d, task.why); return;
  }

  switch(a.a){
    case 'start':
      if(!S.adoptedAt) S.adoptedAt = Date.now();
      S.screen='setup'; S.step=0; S.started=true; save(); render(); break;
    case 'resume': S.screen='app'; S.tab='home'; render(); break;
    case 'browse':
      if(!S.adoptedAt) S.adoptedAt = Date.now();
      S.started = true; S.screen='app'; S.tab='care'; S.careCat='All'; save(); render(); break;
    case 'demo':
      /* A clearly fictional sample so the prototype can be demonstrated without
         publishing anyone's real animal ID or microchip number. */
      Object.assign(S.pet, { shelterName:'Sample', name:'', id:'A0000000000', microchip:'000000000000000',
        species:'Cat', age:'3 months', sex:'Male, altered', weight:'1 kg', breed:'Domestic Shorthair Mix',
        color:'Orange/White', altered:'yes', rabies:'no',
        story:'Sample record for demonstration only — no real animal. Replace every field with the details from the shelter profile sheet. This is where the foster carer\'s notes go: how the animal arrived, what they were like at first, and what they are like now. It is the part that disappears when paperwork gets lost.' });
      save(); render(); toast('Sample record loaded — replace with real details'); break;
    case 'next':
      if(S.step < 4){ S.step++; render(); $('.screen').scrollTop=0; }
      break;
    case 'back':
      if(S.step > 0){ S.step--; render(); } else { S.screen='welcome'; render(); }
      break;
    case 'keepname': S.pet.keepName = true; S.pet.name = ''; save(); render(); break;
    case 'newname':  S.pet.keepName = false; save(); render(); setTimeout(()=>{ const i=document.querySelector('[data-f="pet.name"]'); if(i) i.focus(); },30); break;
    case 'pick': { const fi = document.getElementById('filein') || (()=>{ const n=document.createElement('input'); n.type='file'; n.accept='image/*'; n.id='filein'; n.className='hidden'; document.body.append(n); return n; })();
      fi.dataset.k = a.k || 'photo'; fi.click(); break; }
    case 'clearphoto': S.pet[a.k]=''; save(); render(); break;
    case 'finish':
      S.tasks.photo = !!(S.pet.photo || S.pet.dayOnePhoto);
      S.screen='celebrate'; save(); render(); break;
    case 'toperks': S.screen='perks'; save(); render(); break;
    case 'review': S.screen='review'; save(); render(); break;
    case 'torecord': S.screen='app'; S.tab='record'; save(); render(); break;
    case 'closereview': S.screen='app'; S.tab='record'; render(); break;
    case 'confirm':
      if(!S.owner.name || REVIEW.some(([k])=>!S.acks[k])) return;
      S.adopter.confirmedAt = Date.now(); save(); render(); toast('Receipt confirmed'); break;
    case 'unconfirm': S.adopter.confirmedAt=''; save(); render(); break;
    case 'entered': S.screen='app'; S.tab='home'; save(); render(); break;
    case 'tab-record': S.screen='app'; S.tab='record'; save(); render(); break;
    case 'closedoc': S.screen = (S.docFrom==='review'||S.docFrom==='welcome') ? S.docFrom : 'app'; render(); break;
    case 'perks': sheetPerks(); break;
    case 'qr': sheetQR(); break;
    case 'editvet': sheetEdit('vet'); break;
    case 'editowner': sheetEdit('owner'); break;
    case 'editpet': sheetEdit('pet'); break;
    case 'baseurl': sheetEdit('base'); break;
    case 'savesheet': closeSheet(); render(); toast('Saved'); break;
    case 'closesheet': closeSheet(); break;
    case 'ackall': REVIEW.forEach(([k])=>S.acks[k]=true); save(); render(); toast('All '+REVIEW.length+' marked reviewed'); break;
    case 'sign':
      if(!S.staff.name) return;
      S.staff.signedAt = Date.now(); save(); render(); toast('Sign-off recorded'); break;
    case 'unsign': S.staff.signedAt=''; save(); render(); break;
    case 'share': doShare(); break;
    case 'export': doExport(); break;
    case 'icsall': icsAll(); break;
    case 'reset':
      sheet(`<h2>Start a new record?</h2>
        <p class="lede" style="margin:10px 0 18px">This clears ${esc(petName())}'s details, photos and checklist from this device. Download a copy first if you want to keep it.</p>
        <div class="stack">
          <button class="btn btn-2" data-a="export">Download a copy first</button>
          <button class="btn" style="background:var(--rust)" data-a="reset2">Clear and start over</button>
          <button class="btn btn-3" data-a="closesheet">Cancel</button>
        </div>`); break;
    case 'reset2':
      S = JSON.parse(JSON.stringify(BLANK));
      clearStore();
      closeSheet(); render(); toast('Cleared'); break;
  }
});

document.addEventListener('keydown', e => { if(e.key === 'Escape') closeSheet(); });

/* =============================================================
   INIT
   ============================================================= */
/* Installable, and offline after the first open. The manifest is inline so the
   app stays one file; sw.js is optional and only used if it sits alongside. */
(function(){
  const icon = 'data:image/svg+xml,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><rect width="120" height="120" rx="24" fill="#0D5350"/><g transform="translate(14,14) scale(0.766)"><path d="${MARK_PATH}" fill="#fff" fill-rule="evenodd"/></g></svg>`);
  const manifest = {
    name:'First Day — Seattle Animal Shelter', short_name:'First Day',
    start_url:'.', scope:'.', display:'standalone',
    background_color:'#F1F4EF', theme_color:'#0D5350',
    description:'Your adoption folder, on your phone.',
    icons:[{src:icon, sizes:'any', type:'image/svg+xml', purpose:'any maskable'}]
  };
  const l = document.createElement('link');
  l.rel = 'manifest';
  l.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
  document.head.appendChild(l);
  const t = document.createElement('link');
  t.rel = 'apple-touch-icon'; t.href = icon; document.head.appendChild(t);
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* fine without it */ });
  }
})();

(async function(){
  await load();
  if(S.started && S.screen === 'setup') S.screen = 'app';
  const m = location.hash.match(/pet=([^&]+)/);
  if(m && !S.pet.id) S.pet.id = decodeURIComponent(m[1]);
  render();
})();
</script>
